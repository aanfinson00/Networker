<title>Networker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Instrument+Serif&display=swap">
<style>
/* Layout: one working column (max 1080px) under a quiet header; tabs switch views; a right drawer holds one person's record. */
:root {
  --bg: #f5f0eb;
  --surface: #fbf8f4;
  --raised: #ffffff;
  --ink: #1c1917;
  --muted: #736a62;
  --faint: #a69c93;
  --line: #e4dbd1;
  --accent: #b87040;
  --accent-ink: #ffffff;
  --accent-soft: rgba(212, 137, 90, 0.14);
  --ok: #4f7a58;
  --ok-soft: rgba(79, 122, 88, 0.13);
  --warn: #a8761f;
  --warn-soft: rgba(168, 118, 31, 0.14);
  --crit: #b0473a;
  --crit-soft: rgba(176, 71, 58, 0.12);
  --scrim: rgba(28, 25, 23, 0.32);
  --font-ui: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Outfit", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --t-fast: 150ms;
  --t-mid: 250ms;
  --t-slow: 400ms;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1917; --surface: #23201d; --raised: #2a2623; --ink: #efe8e1; --muted: #a79e96; --faint: #7a716a;
    --line: #38312c; --accent: #d4895a; --accent-ink: #1c1917; --accent-soft: rgba(212, 137, 90, 0.16);
    --ok: #86b592; --ok-soft: rgba(134, 181, 146, 0.14); --warn: #d9ab5c; --warn-soft: rgba(217, 171, 92, 0.14);
    --crit: #e08476; --crit-soft: rgba(224, 132, 118, 0.14); --scrim: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1917; --surface: #23201d; --raised: #2a2623; --ink: #efe8e1; --muted: #a79e96; --faint: #7a716a;
  --line: #38312c; --accent: #d4895a; --accent-ink: #1c1917; --accent-soft: rgba(212, 137, 90, 0.16);
  --ok: #86b592; --ok-soft: rgba(134, 181, 146, 0.14); --warn: #d9ab5c; --warn-soft: rgba(217, 171, 92, 0.14);
  --crit: #e08476; --crit-soft: rgba(224, 132, 118, 0.14); --scrim: rgba(0, 0, 0, 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; font-weight: 400; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 64px; }
@media (max-width: 480px) { .wrap { padding-inline: 16px; } }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { display: grid; grid-template-columns: repeat(3, 7px); gap: 2px; }
.mark i { width: 7px; height: 7px; background: var(--line); border-radius: 1px; display: block; }
.mark i.on { background: var(--accent); }
.wordmark { font-family: var(--font-display); font-weight: 200; font-size: 28px; letter-spacing: 0.01em; }
.goal { color: var(--muted); font-size: 13.5px; }
.goal b { color: var(--ink); font-weight: 500; }

.tabs { display: flex; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 10px 12px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 400; transition: color var(--t-fast) var(--ease); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.tab .badge { margin-left: 6px; }
.tab:focus-visible, .btn:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { margin-top: 24px; }
section + section { margin-top: 32px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.serif { font-family: var(--font-serif); font-weight: 400; }
.lede { font-family: var(--font-serif); font-size: 26px; line-height: 1.2; max-width: 30ch; }
.hint { color: var(--muted); font-size: 13.5px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-weight: 200; font-size: 34px; line-height: 1.1; }
.stat .v small { font-size: 16px; color: var(--muted); font-weight: 300; }
.stat .s { font-size: 13px; color: var(--muted); }
.stat.alert .v { color: var(--crit); }
.stat.good .v { color: var(--ok); }

.spark { display: flex; align-items: flex-end; gap: 3px; height: 30px; margin-top: 4px; }
.spark span { flex: 1; background: var(--line); border-radius: 2px 2px 0 0; min-height: 2px; }
.spark span.cur { background: var(--accent); }
.spark span.hit { background: var(--faint); }

/* Coverage */
.coverage { display: flex; flex-wrap: wrap; gap: 8px; }
.cov { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px dashed var(--faint); color: var(--muted); font-size: 13.5px; }
.cov.on { border: 1px solid transparent; background: var(--ok-soft); color: var(--ink); }
.cov .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }
.cov.on .n { color: var(--ok); font-weight: 500; }

/* Lists */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line); cursor: pointer; transition: background var(--t-fast) var(--ease); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--raised); }
.row .who { min-width: 0; }
.row .name { font-weight: 500; }
.row .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); }
.empty .serif { font-size: 22px; color: var(--ink); display: block; margin-bottom: 6px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.inner { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 500; }
.pill.core { color: var(--ink); }
.pill.int { border-style: dashed; }
.pill.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--raised); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--crit); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--raised); }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button:hover { color: var(--ink); background: var(--accent-soft); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; }
input[type="text"], input[type="search"], input[type="date"], input[type="month"], input[type="number"], select, textarea {
  background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14px; min-width: 0; max-width: 100%;
}
textarea { width: 100%; resize: vertical; min-height: 64px; line-height: 1.45; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); min-width: 0; }
label.f > input, label.f > select, label.f > textarea { text-transform: none; letter-spacing: 0; color: var(--ink); width: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }

/* Drawer */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--t-mid) var(--ease); z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--bg); border-left: 1px solid var(--line); z-index: 21; transform: translateX(100%); transition: transform var(--t-slow) var(--ease); overflow-y: auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(32px + env(safe-area-inset-bottom, 0px)); }
.drawer.open { transform: none; }
.drawer h2 { font-family: var(--font-serif); font-size: 30px; line-height: 1.1; }
.drawer .sub { color: var(--muted); margin-top: 4px; }
.drawer .stack { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.dhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.touches { display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--line); margin-left: 4px; }
.touch { position: relative; padding: 2px 0 12px 16px; }
.touch::before { content: ""; position: absolute; left: -6px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.touch .when { font-size: 12.5px; color: var(--muted); }
.touch .what { overflow-wrap: anywhere; }
.addtouch { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
@media (max-width: 480px) { .addtouch { grid-template-columns: 1fr 1fr; } .addtouch input[type="text"] { grid-column: 1 / -1; } }

/* Wins & plan */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.done { border-color: var(--ok); }
.card .wtitle { font-size: 16px; font-weight: 500; line-height: 1.3; border-color: transparent; background: none; padding: 4px 6px; margin: -4px -6px; min-height: 0; resize: none; width: calc(100% + 12px); max-width: none; }
.card .wtitle:hover { border-color: var(--line); }
.card .people { display: flex; flex-wrap: wrap; gap: 6px; }
.card .foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

.phase { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-top: 1px solid var(--line); }
.phase:first-of-type { border-top: 0; }
@media (max-width: 680px) { .phase { grid-template-columns: 1fr; gap: 10px; } }
.phase .when { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.phase h3 { font-family: var(--font-serif); font-size: 24px; line-height: 1.15; margin-top: 2px; }
.phase.now h3 { color: var(--accent); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width var(--t-slow) var(--ease); }
.ms { display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; }
.ms input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.ms .t { flex: 1; min-width: 0; }
.ms .d { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ms.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.ms.late .d { color: var(--crit); }

.drop { border: 1.5px dashed var(--faint); border-radius: var(--r); padding: 28px 20px; text-align: center; background: var(--surface); transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.steps { margin: 8px 0 0; padding-left: 20px; color: var(--muted); }
.steps li { margin: 3px 0; }
.progress { margin-top: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity var(--t-mid) var(--ease), transform var(--t-mid) var(--ease); z-index: 40; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); font-size: 14px; margin-bottom: 16px; }
.more { display: flex; justify-content: center; padding: 12px; }
.two { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
      <span class="wordmark">Networker</span>
    </div>
    <div class="goal" id="goal">Goal: <b>Director of Asset Management</b></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Contact details"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // ---------- Reference data ----------
  const FNS = [
    ["lending", "Lenders"], ["capmkts", "Capital markets"], ["sales", "Brokerage"], ["leasing", "Leasing"],
    ["development", "Development"], ["acquisitions", "Acquisitions"], ["owners", "Owners & sponsors"], ["law", "Legal"], ["am", "Asset mgmt"],
    ["investors", "Investors & IR"], ["recruiters", "Recruiters"], ["pm", "Property ops"], ["other", "Other"],
  ];
  const FN = Object.fromEntries(FNS);
  const COVERAGE = ["lending", "capmkts", "sales", "leasing", "development", "acquisitions", "law", "am"];
  const TIERS = [["inner", "Inner circle"], ["core", "Core"], ["wide", "Wide"], ["none", "Untiered"], ["skip", "Not now"]];
  const TIER = Object.fromEntries(TIERS);
  const CADENCE = { inner: 30, core: 90, wide: 180 };
  const ROLES = [["", "None"], ["sponsor", "Sponsor"], ["decision", "Decision-maker"], ["calibration", "Calibration voice"], ["peer", "Peer"], ["mentor", "Mentor"]];
  const ROLE = Object.fromEntries(ROLES);
  const TOUCH_TYPES = [["lunch", "Lunch"], ["coffee", "Coffee"], ["call", "Call"], ["meeting", "Meeting"], ["event", "Event"], ["note", "Note / email"]];
  const TOUCH = Object.fromEntries(TOUCH_TYPES);
  const CONVO = new Set(["lunch", "coffee", "call", "meeting"]);
  const WIN_STATUS = [["idea", "Idea"], ["active", "In progress"], ["done", "Done"]];
  const WIN_AREAS = [["refi", "Refinance / debt"], ["holdsell", "Hold / sell"], ["leasing", "Leasing"], ["turnaround", "Asset turnaround"], ["investors", "Investors / IC"], ["budget", "Budget & business plan"], ["team", "Team"], ["other", "Other"]];
  const WIN_AREA = Object.fromEntries(WIN_AREAS);
  const PHASES = {
    1: ["Get the criteria", "Oct – Dec 2026", "2026-10", "2026-12"],
    2: ["Deliver director-level wins", "Jan – Jun 2027", "2027-01", "2027-06"],
    3: ["Operate at the next level", "Jul – Sep 2027", "2027-07", "2027-09"],
    4: ["Make the case", "Oct – Dec 2027", "2027-10", "2027-12"],
  };

  // ---------- State ----------
  const S = {
    tab: "week",
    contacts: new Map(),
    wins: [],
    milestones: [],
    settings: { firm: "", weeklyTarget: 3, targetDate: "2027-12-15" },
    loaded: false,
    dbState: "connecting", // connecting | ready | none | readonly
    filters: { q: "", side: "", fn: "", tier: "active" },
    triageFn: "",
    limit: 120,
    open: null,
    importing: null,
  };
  let db = null;
  try { const t = localStorage.getItem("networker.tab"); if (t) S.tab = t; } catch (e) {}

  // ---------- Helpers ----------
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => iso(new Date());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const weekStart = (s) => { const d = parse(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return iso(d); };
  const monthKey = (s) => s.slice(0, 7);
  const fmtDate = (s) => { if (!s) return ""; const d = parse(s); return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: d.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined }); };
  const fmtMonth = (s) => parse(s + "-01").toLocaleDateString(undefined, { month: "short", year: "numeric" });
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const fullName = (c) => `${c.first || ""} ${c.last || ""}`.trim() || "Unnamed";
  const opts = (pairs, sel) => pairs.map(([v, l]) => `<option value="${esc(v)}"${v === sel ? " selected" : ""}>${esc(l)}</option>`).join("");
  const safeId = (s) => s.replace(/[^A-Za-z0-9_\-.~:@+]/g, "-").replace(/-+/g, "-").replace(/^[-.]+|[-.]+$/g, "").slice(0, 120);
  const ICON = {
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>',
    ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  };

  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  // ---------- Classification ----------
  const BROKER_FIRMS = /\b(jll|cbre|cushman|newmark|colliers|avison young|marcus (&|and) millichap|institutional property advisors|\bipa\b|greysteel|transwestern|lee (&|and) associates|\bnai\b|stream realty|holt lunsford|knight commercial|thirty-four commercial|bradford|matthews real estate|savills|kidder mathews|partners real estate|younger partners|structure commercial|cohera commercial|commercial realty|commercial properties)\b/;
  const LENDER_FIRMS = /\b(wells fargo|j\.?p\.? ?morgan|chase|bank of america|citi(bank|group)?|truist|pnc|frost|comerica|texas capital|regions|capital one|goldman sachs|morgan stanley|freddie mac|fannie mae|bellwether enterprise|arbor realty|ready capital|lument|kkr real estate finance|starwood property trust|ladder capital|prudential mortgage|pgim real estate|life insurance|mutual of omaha)\b/;
  const OWNER_FIRMS = /real estate|realty|properties|property group|residential|communities|apartment|multifamily|\breit\b|\bhomes\b|land company|s2 capital|compatriot|northpoint|montgomery street|calida|related companies|blue owl|carlyle|blackstone|starwood|brookfield|cortland|bell partners|camden|\bmaa\b|hines|trammell crow|lincoln property|nuveen|principal asset management|invesco|clarion|harbor group|crow holdings|hillwood|stillwater capital|hudson advisors|maymont|cypress growth|\bcapital\b|\binvestments?\b|\bindustrial\b/;
  const SENIOR_GENERIC = /\b(associate|analyst|vice president|vp|svp|evp|director|managing director|principal|partner|president|vice chair|chairman|founder|ceo|chief|executive)\b/;
  const NOT_RE_ROLE = /engineer|software|developer\b|technolog|\bit\b|marketing|human resources|\bhr\b|recruit|accountant|accounting|payroll|designer|nurse|teacher|educator|intern\b/;
  function classify(position, company) {
    const p = (position || "").toLowerCase(), c = (company || "").toLowerCase(), s = p + " | " + c;
    if (!/assurance|audit|\btax\b|accountant/.test(p) && (/\b(attorney|counsel|lawyer|paralegal|legal)\b/.test(s) || /\blaw\b/.test(p) || (/\b(llp|pllc|law|p\.?c\.?)$|\b(llp|pllc|law)\b/.test(c) && /partner|associate|counsel|shareholder/.test(p)))) return "law";
    if (/recruit|talent|executive search|headhunt|staffing|\bsearch partners\b/.test(s) || /\bsearch\b/.test(c) || /ferguson partners|heidrick|korn ferry|cel (&|and) associates|russell reynolds|spencer stuart|crown advisors|hirewell|\bgpac\b|options group/.test(c)) return "recruiters";
    if (/capital markets|debt (&|and) equity|debt placement|equity placement|structured finance|mortgage bank/.test(s) || /walker ?(&|and) ?dunlop|berkadia|eastdil|northmarq|greystone|hff\b/.test(c)) return "capmkts";
    if (/leasing consultant|leasing professional|leasing agent|community manag|property manag|regional manag|regional property|maintenance|\bresident\b/.test(p)) return "pm";
    if (/\b(lend|lending|lender|loan|loans|originat\w*|credit|underwrit\w*|banker|banking|relationship manager)\b/.test(p) || ((/\bbank\b|bancorp|credit union|debt fund|lending/.test(c) || LENDER_FIRMS.test(c)) && !NOT_RE_ROLE.test(p))) return "lending";
    if (/real estate|mortgage/.test(p) && /insurance|financial services|\blife\b|principal financial|athene/.test(c)) return "lending";
    if (/leasing|tenant rep|tenant representation|landlord rep|agency leas/.test(p)) return "leasing";
    if (/investment sales|multifamily advisory|real estate advisor|\bbroker\b|brokerage|\bagent\b/.test(p) || /institutional property advisors|marcus ?(&|and) ?millichap/.test(c) || (BROKER_FIRMS.test(c) && !NOT_RE_ROLE.test(p) && !/asset manag|portfolio manag|valuation/.test(p))) return "sales";
    if (/asset manag|portfolio manag|investment management/.test(p)) return "am";
    if (/acquisition|acquistion|transactions|\binvestments?\b|\breal estate\b.*\b(associate|analyst)\b|\b(associate|analyst)\b.*\breal estate\b|m&a/.test(p)) return "acquisitions";
    if (/develop|construction|pre-?construction|estimator|superintendent|architect|general contractor|contracting|builders/.test(s) && !NOT_RE_ROLE.test(p) && !/business develop|player develop|program|process|product develop/.test(p)) return "development";
    if (/investor relations|capital rais|fundrais|limited partner|pension|endowment|family office/.test(s)) return "investors";
    if (OWNER_FIRMS.test(c) && SENIOR_GENERIC.test(p) && !NOT_RE_ROLE.test(p)) return "owners";
    if (/operations|\bops\b/.test(p)) return "pm";
    return "other";
  }
  const isInternal = (company) => { const f = (S.settings.firm || "").trim().toLowerCase(); return !!f && (company || "").toLowerCase().includes(f); };

  // ---------- Derived ----------
  function nextDue(c) {
    const days = CADENCE[c.tier]; if (!days) return null;
    return c.lastTouch ? addDays(c.lastTouch, days) : today();
  }
  function dueInfo(c) {
    const nd = nextDue(c); if (!nd) return null;
    const d = daysBetween(today(), nd);
    if (!c.lastTouch) return { d: 0, label: "No touch yet", cls: "warn" };
    if (d < 0) return { d, label: `${-d}d overdue`, cls: "crit" };
    if (d === 0) return { d, label: "Due today", cls: "warn" };
    return { d, label: `Due in ${d}d`, cls: d <= 7 ? "warn" : "" };
  }
  const active = () => [...S.contacts.values()].filter((c) => CADENCE[c.tier]);
  function allTouches() {
    const out = [];
    for (const c of S.contacts.values()) for (const t of c.touches || []) out.push({ ...t, c });
    return out;
  }

  // ---------- DB writes ----------
  async function withRetry(fn) {
    for (let i = 0; i < 6; i++) {
      try { return await fn(); }
      catch (e) {
        if (e && (e.code === "resource_exhausted" || e.code === "unavailable") && i < 5) { await sleep(700 * (i + 1) + Math.random() * 400); continue; }
        throw e;
      }
    }
  }
  function onWriteError(e) {
    if (e && e.code === "invalid_argument") { S.dbState = "readonly"; toast("This view can't save changes."); render(); }
    else if (e && e.code === "quota_exceeded") toast("Storage is full. Remove some contacts and try again.");
    else toast("Couldn't save. Check your connection and try again.");
    console.error(e);
  }
  const chains = new Map();
  function queue(path, op) {
    const prev = chains.get(path) || Promise.resolve();
    const p = prev.then(() => withRetry(op)).catch(onWriteError);
    chains.set(path, p);
    return p;
  }
  function saveContact(id, patch) {
    const c = S.contacts.get(id); if (!c) return;
    Object.assign(c, patch);
    if (!db) return;
    return queue("contacts/" + id, () => db.doc("contacts/" + id).update(patch));
  }
  function setDoc(path, data) { if (!db) return; return queue(path, () => db.doc(path).set(data)); }
  function updateDoc(path, data) { if (!db) return; return queue(path, () => db.doc(path).update(data)); }
  function deleteDoc(path) { if (!db) return; return queue(path, () => db.doc(path).delete()); }

  const timers = {};
  function debounced(key, fn, ms = 600) { clearTimeout(timers[key]); timers[key] = setTimeout(fn, ms); }

  // ---------- Loading ----------
  async function loadContacts() {
    const all = new Map(); let last = null;
    for (let guard = 0; guard < 60; guard++) {
      let q = db.collection("contacts");
      if (last !== null) q = q.where("key", ">", last);
      const snap = await withRetry(() => q.orderBy("key").limit(500).get());
      for (const d of snap.docs) all.set(d.id, { ...clone(d.data()), id: d.id });
      if (snap.size < 500) break;
      last = snap.docs[snap.size - 1].data().key;
    }
    S.contacts = all;
  }
  let lastLoad = 0;
  async function refresh() {
    if (!db || S.importing) return;
    try { await loadContacts(); lastLoad = Date.now(); S.loaded = true; render(); if (S.open) renderDrawer(); }
    catch (e) { console.error(e); }
  }

  async function boot() {
    render();
    try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
    if (!db) { S.dbState = "none"; S.loaded = true; render(); return; }
    S.dbState = "ready";
    db.doc("settings/main").onSnapshot((s) => {
      if (s.exists) S.settings = { ...S.settings, ...clone(s.data()) };
      render();
    }, (e) => console.error(e));
    db.collection("wins").orderBy("order").onSnapshot((s) => {
      S.wins = s.docs.map((d) => ({ ...clone(d.data()), id: d.id })); render(); if (S.open) renderDrawer();
    }, (e) => console.error(e));
    db.collection("milestones").orderBy("order").onSnapshot((s) => {
      S.milestones = s.docs.map((d) => ({ ...clone(d.data()), id: d.id })); render();
    }, (e) => console.error(e));
    await refresh();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && Date.now() - lastLoad > 60000) refresh();
    });
  }

  // ---------- Rendering ----------
  function renderTabs() {
    const untriaged = [...S.contacts.values()].filter((c) => (c.tier || "none") === "none").length;
    const overdue = active().filter((c) => { const i = dueInfo(c); return i && i.d <= 0; }).length;
    const tabs = [["week", "This week", overdue], ["people", "People", 0], ["triage", "Triage", untriaged], ["wins", "Wins", 0], ["plan", "Plan", 0], ["import", "Import & setup", 0]];
    $("#tabs").innerHTML = tabs.map(([k, l, n]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}${n ? `<span class="badge">${n}</span>` : ""}</button>`).join("");
  }

  function render() {
    renderTabs();
    const weeks = Math.max(0, Math.ceil(daysBetween(today(), S.settings.targetDate || "2027-12-15") / 7));
    $("#goal").innerHTML = `Goal: <b>Director of Asset Management</b> · <span class="num">${weeks}</span> weeks to target`;
    const m = $("#main");
    let notice = "";
    if (S.dbState === "none") notice = `<div class="notice">Open this page in claude.ai while signed in to load and save your tracker. Nothing here will be saved until then.</div>`;
    if (S.dbState === "readonly") notice = `<div class="notice">You can view this tracker, but changes from this view are not being saved.</div>`;
    const views = { week: viewWeek, people: viewPeople, triage: viewTriage, wins: viewWins, plan: viewPlan, import: viewImport };
    // Keep focus and caret in the search box across re-renders.
    const ae = document.activeElement; const fid = ae && ae.id && m.contains(ae) ? ae.id : null;
    const sel = fid && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;
    m.innerHTML = notice + (S.loaded || S.dbState !== "connecting" ? (views[S.tab] || viewWeek)() : `<div class="empty">Loading your network…</div>`);
    if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch (e) {} } }
  }

  function personRow(c, right) {
    const fn = FN[c.fn] || "Other";
    const meta = [c.position, c.company].filter(Boolean).join(" · ");
    return `<div class="row" tabindex="0" data-open="${esc(c.id)}">
      <div class="who"><div class="name">${esc(fullName(c))}</div><div class="meta">${esc(meta || "No title on file")}</div></div>
      <div class="side">${right ?? ""}<span class="pill${c.side === "internal" ? " int" : ""}">${c.side === "internal" ? "Internal · " : ""}${esc(fn)}</span></div>
    </div>`;
  }
  const tierPill = (c) => CADENCE[c.tier] ? `<span class="pill ${c.tier}">${esc(TIER[c.tier])}</span>` : "";

  function viewWeek() {
    const t = today(), ws = weekStart(t), mk = monthKey(t);
    const touches = allTouches();
    const convos = touches.filter((x) => CONVO.has(x.t));
    const thisWeek = convos.filter((x) => x.d >= ws && x.d <= addDays(ws, 6));
    const wInt = thisWeek.filter((x) => x.c.side === "internal").length;
    const wExt = thisWeek.length - wInt;
    const target = Number(S.settings.weeklyTarget) || 3;
    const spark = [];
    for (let i = 9; i >= 0; i--) {
      const s = addDays(ws, -7 * i), e = addDays(s, 6);
      const n = convos.filter((x) => x.d >= s && x.d <= e).length;
      spark.push({ n, cur: i === 0 });
    }
    const maxN = Math.max(target, ...spark.map((x) => x.n), 1);
    const act = active();
    const due = act.map((c) => ({ c, i: dueInfo(c) })).filter((x) => x.i && x.i.d <= 7).sort((a, b) => (a.i.d - b.i.d) || (a.c.tier === "inner" ? -1 : 1));
    const overdue = due.filter((x) => x.i.d < 0 || !x.c.lastTouch).length;
    const sponsors = [...S.contacts.values()].filter((c) => c.role === "sponsor").length;
    const owe = [...S.contacts.values()].filter((c) => (c.owe || "").trim());
    const cov = {}; COVERAGE.forEach((f) => (cov[f] = 0));
    touches.filter((x) => x.t !== "note" && monthKey(x.d) === mk && x.c.side !== "internal" && cov[x.c.fn] !== undefined).forEach((x) => cov[x.c.fn]++);
    const covered = COVERAGE.filter((f) => cov[f] > 0).length;
    const nextMs = S.milestones.filter((m) => !m.done).slice(0, 3);

    if (!S.contacts.size) {
      return `<section><p class="lede">Your network, organized around one goal.</p>
        <p class="hint" style="max-width:60ch;margin-top:10px">Import your LinkedIn connections, sort the people who matter into tiers, and this page will tell you who to call this week, which parts of the market you haven't heard from lately, and what you owe people.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn primary" data-tab="import">${ICON.upload} Import connections</button><button class="btn" data-action="new-contact">${ICON.plus} Add a person</button></div></section>
        ${planPreview(nextMs)}`;
    }

    return `<section class="stats">
        <div class="stat ${thisWeek.length >= target ? "good" : ""}"><span class="k">Conversations this week</span><span class="v num">${thisWeek.length}<small> / ${target}</small></span><span class="s">${wInt} internal · ${wExt} external</span>
          <div class="spark" aria-label="Conversations per week, last 10 weeks">${spark.map((x) => `<span class="${x.cur ? "cur" : x.n >= target ? "hit" : ""}" style="height:${Math.max(6, (x.n / maxN) * 100)}%" title="${x.n}"></span>`).join("")}</div></div>
        <div class="stat ${overdue ? "alert" : ""}"><span class="k">Overdue</span><span class="v num">${overdue}</span><span class="s">${act.length} people in your tiers</span></div>
        <div class="stat ${sponsors >= 2 ? "good" : ""}"><span class="k">Sponsors</span><span class="v num">${sponsors}<small> / 2</small></span><span class="s">${sponsors >= 2 ? "Both seats filled" : "Mark them in a contact's role"}</span></div>
        <div class="stat"><span class="k">Market coverage</span><span class="v num">${covered}<small> / ${COVERAGE.length}</small></span><span class="s">Functions heard from this month</span></div>
      </section>
      <section><div class="sec-head"><h2 class="sec-title">Coverage this month</h2><span class="hint">External conversations by function</span></div>
        <div class="coverage">${COVERAGE.map((f) => `<button class="cov ${cov[f] ? "on" : ""}" data-cov="${f}">${esc(FN[f])} <span class="n">${cov[f]}</span></button>`).join("")}</div>
      </section>
      <div class="two">
        <section><div class="sec-head"><h2 class="sec-title">Reach out next</h2><span class="hint">Overdue or due within 7 days</span></div>
          <div class="list">${due.length ? due.slice(0, 25).map(({ c, i }) => personRow(c, `${tierPill(c)}<span class="pill ${i.cls}">${esc(i.label)}</span>`)).join("") : `<div class="empty"><span class="serif">You're caught up.</span>Nobody in your tiers is due this week.</div>`}</div>
        </section>
        <div>
          <section><div class="sec-head"><h2 class="sec-title">What you owe people</h2></div>
            <div class="list">${owe.length ? owe.map((c) => `<div class="row" tabindex="0" data-open="${esc(c.id)}"><div class="who"><div class="name">${esc(fullName(c))}</div><div class="meta">${esc(c.owe)}</div></div><div class="side"></div></div>`).join("") : `<div class="empty">Nothing outstanding. Promises you make in a meeting go in the contact's "I owe them" field.</div>`}</div>
          </section>
          ${planPreview(nextMs)}
        </div>
      </div>`;
  }
  function planPreview(ms) {
    if (!ms.length) return "";
    const t = monthKey(today());
    return `<section><div class="sec-head"><h2 class="sec-title">Next on the plan</h2><button class="btn ghost sm" data-tab="plan">See the plan</button></div>
      <div class="panel">${ms.map((m) => `<label class="ms ${m.due < t ? "late" : ""}"><input type="checkbox" data-ms="${esc(m.id)}"><span class="t">${esc(m.title)}</span><span class="d">${esc(fmtMonth(m.due))}</span></label>`).join("")}</div></section>`;
  }

  function filteredPeople() {
    const { q, side, fn, tier } = S.filters; const qq = q.trim().toLowerCase();
    let list = [...S.contacts.values()];
    if (tier === "active") list = list.filter((c) => CADENCE[c.tier]);
    else if (tier) list = list.filter((c) => (c.tier || "none") === tier);
    if (side) list = list.filter((c) => c.side === side);
    if (fn) list = list.filter((c) => c.fn === fn);
    if (qq) list = list.filter((c) => `${fullName(c)} ${c.company || ""} ${c.position || ""} ${c.notes || ""}`.toLowerCase().includes(qq));
    const rank = { inner: 0, core: 1, wide: 2, none: 3, skip: 4 };
    return list.sort((a, b) => (rank[a.tier || "none"] - rank[b.tier || "none"]) || fullName(a).localeCompare(fullName(b)));
  }
  function viewPeople() {
    const list = filteredPeople();
    return `<section>
      <div class="filters">
        <input type="search" id="f-q" placeholder="Search name, firm, title or notes" value="${esc(S.filters.q)}" aria-label="Search people">
        <select id="f-tier" aria-label="Tier">${opts([["active", "Inner, core & wide"], ["", "Everyone"], ...TIERS], S.filters.tier)}</select>
        <select id="f-side" aria-label="Internal or external">${opts([["", "Internal & external"], ["internal", "Internal"], ["external", "External"]], S.filters.side)}</select>
        <select id="f-fn" aria-label="Function">${opts([["", "All functions"], ...FNS], S.filters.fn)}</select>
        <button class="btn" data-action="new-contact">${ICON.plus} Add</button>
      </div>
      <p class="hint" style="margin:0 0 10px"><span class="num">${list.length}</span> ${list.length === 1 ? "person" : "people"}</p>
      <div class="list">${list.length ? list.slice(0, S.limit).map((c) => { const i = dueInfo(c); return personRow(c, `${tierPill(c)}${i ? `<span class="pill ${i.cls}">${esc(i.label)}</span>` : ""}`); }).join("") : `<div class="empty"><span class="serif">No one here yet.</span>${S.contacts.size ? "Try a different filter, or tier people from the Triage tab." : "Import your LinkedIn connections to get started."}</div>`}</div>
      ${list.length > S.limit ? `<div class="more"><button class="btn" data-action="more">Show more</button></div>` : ""}
    </section>`;
  }

  function viewTriage() {
    let list = [...S.contacts.values()].filter((c) => (c.tier || "none") === "none");
    const counts = {}; list.forEach((c) => (counts[c.fn] = (counts[c.fn] || 0) + 1));
    if (S.triageFn) list = list.filter((c) => c.fn === S.triageFn);
    const order = Object.fromEntries(FNS.map(([k], i) => [k, i]));
    list.sort((a, b) => (order[a.fn] - order[b.fn]) || fullName(a).localeCompare(fullName(b)));
    const tiered = active().length;
    return `<section>
      <div class="sec-head"><div><h2 class="lede" style="font-size:24px">Sort the people who matter.</h2>
        <p class="hint" style="margin-top:6px;max-width:64ch">Inner circle: monthly contact (boss, sponsors, key lenders and AM directors). Core: quarterly. Wide: twice a year. "Not now" hides someone from this list. Aim for about 15 inner, 40–50 core.</p></div>
        <span class="hint num">${tiered} tiered · ${counts ? Object.values(counts).reduce((a, b) => a + b, 0) : 0} to sort</span></div>
      <div class="coverage" style="margin-bottom:14px">
        <button class="cov ${!S.triageFn ? "on" : ""}" data-tfn="">All</button>
        ${FNS.filter(([k]) => counts[k]).map(([k, l]) => `<button class="cov ${S.triageFn === k ? "on" : ""}" data-tfn="${k}">${esc(l)} <span class="n">${counts[k]}</span></button>`).join("")}
      </div>
      <div class="list">${list.length ? list.slice(0, S.limit).map((c) => `<div class="row" data-id="${esc(c.id)}">
          <div class="who" data-open="${esc(c.id)}" style="cursor:pointer"><div class="name">${esc(fullName(c))}${c.side === "internal" ? ' <span class="pill int">Internal</span>' : ""}</div><div class="meta">${esc([c.position, c.company].filter(Boolean).join(" · ") || "No title on file")}</div></div>
          <div class="side">
            <select data-tfnset="${esc(c.id)}" aria-label="Function for ${esc(fullName(c))}">${opts(FNS, c.fn)}</select>
            <div class="seg" role="group" aria-label="Tier">${["inner", "core", "wide", "skip"].map((t) => `<button data-tier="${t}" data-cid="${esc(c.id)}">${t === "skip" ? "Not now" : TIER[t].replace(" circle", "")}</button>`).join("")}</div>
          </div></div>`).join("") : `<div class="empty"><span class="serif">${S.contacts.size ? "Everyone's sorted." : "Nothing to sort yet."}</span>${S.contacts.size ? "New imports will show up here." : "Import your LinkedIn connections first."}</div>`}</div>
      ${list.length > S.limit ? `<div class="more"><button class="btn" data-action="more">Show more</button></div>` : ""}
    </section>`;
  }

  function viewWins() {
    const people = [...S.contacts.values()];
    return `<section>
      <div class="sec-head"><div><h2 class="lede" style="font-size:24px">Director-level wins.</h2><p class="hint" style="margin-top:6px;max-width:64ch">Pick two or three. Link the lenders, brokers and lawyers who help with each one, and record the outcome in numbers. These become your promotion case.</p></div>
        <button class="btn" data-action="new-win">${ICON.plus} Add a win</button></div>
      <div class="cards">${S.wins.length ? S.wins.map((w) => {
        const linked = people.filter((c) => c.winId === w.id);
        return `<div class="card ${w.status === "done" ? "done" : ""}">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
            <select data-win="${esc(w.id)}" data-field="area" aria-label="Area">${opts(WIN_AREAS, w.area)}</select>
            <select data-win="${esc(w.id)}" data-field="status" aria-label="Status">${opts(WIN_STATUS, w.status)}</select></div>
          <textarea class="wtitle" id="wt-${esc(w.id)}" data-win="${esc(w.id)}" data-field="title" rows="2" placeholder="Name the win" aria-label="Win">${esc(w.title)}</textarea>
          <label class="f">Target<input type="month" data-win="${esc(w.id)}" data-field="target" value="${esc(w.target || "")}"></label>
          <label class="f">Outcome, in numbers<input type="text" data-win="${esc(w.id)}" data-field="impact" value="${esc(w.impact || "")}" placeholder="e.g. 4 term sheets, saved 40 bps"></label>
          <div><div class="sec-title" style="margin-bottom:6px">People helping</div><div class="people">${linked.length ? linked.map((c) => `<button class="pill" data-open="${esc(c.id)}" style="cursor:pointer">${esc(fullName(c))}</button>`).join("") : `<span class="hint">Link people from their contact page.</span>`}</div></div>
          <div class="foot"><span></span><button class="btn ghost sm danger" data-delwin="${esc(w.id)}">Remove</button></div>
        </div>`;
      }).join("") : `<div class="empty" style="grid-column:1/-1"><span class="serif">No wins yet.</span>Add the two or three results that will prove you're ready.</div>`}</div>
    </section>`;
  }

  function viewPlan() {
    const t = monthKey(today());
    const groups = [1, 2, 3, 4].map((p) => ({ p, items: S.milestones.filter((m) => Number(m.phase) === p) }));
    if (!S.milestones.length) return `<div class="empty"><span class="serif">No plan yet.</span>Milestones will appear here.</div>`;
    return `<section>${groups.map(({ p, items }) => {
      const [title, when, from, to] = PHASES[p];
      const done = items.filter((m) => m.done).length;
      const now = t >= from && t <= to;
      return `<div class="phase ${now ? "now" : ""}">
        <div><div class="when">${esc(when)}${now ? " · Now" : ""}</div><h3>${esc(title)}</h3><div class="hint num" style="margin-top:6px">${done} of ${items.length} done</div><div class="bar"><i style="width:${items.length ? (done / items.length) * 100 : 0}%"></i></div></div>
        <div>${items.map((m) => `<label class="ms ${m.done ? "done" : ""} ${!m.done && m.due < t ? "late" : ""}"><input type="checkbox" data-ms="${esc(m.id)}" ${m.done ? "checked" : ""}><span class="t">${esc(m.title)}</span><span class="d">${esc(fmtMonth(m.due))}</span></label>`).join("")}</div>
      </div>`;
    }).join("")}</section>`;
  }

  function viewImport() {
    const imp = S.importing;
    return `<div class="two">
      <section>
        <div class="sec-head"><h2 class="sec-title">Import LinkedIn connections</h2></div>
        <div class="drop" id="drop">
          <p class="serif" style="font-size:22px;margin:0 0 6px">Drop Connections.csv here</p>
          <p class="hint" style="margin:0 0 14px">Re-importing later only adds new people and refreshes titles. Your tiers and notes stay.</p>
          <label class="btn primary" style="cursor:pointer">${ICON.upload} Choose file<input type="file" id="file" accept=".csv,text/csv" hidden></label>
          ${imp ? `<div class="progress"><div class="hint num">${esc(imp.label)}</div><div class="bar"><i style="width:${imp.total ? (imp.done / imp.total) * 100 : 0}%"></i></div></div>` : ""}
        </div>
        <p class="hint" style="margin-top:14px">How to get the file:</p>
        <ol class="steps">
          <li>On LinkedIn, open <b>Settings &amp; Privacy → Data privacy → Get a copy of your data</b>.</li>
          <li>Pick <b>Want something in particular?</b> and tick <b>Connections</b> only.</li>
          <li>Request the archive. It usually arrives by email in about 10 minutes.</li>
          <li>Unzip it and drop <b>Connections.csv</b> above.</li>
        </ol>
      </section>
      <section>
        <div class="sec-head"><h2 class="sec-title">Setup</h2></div>
        <div class="panel" style="display:flex;flex-direction:column;gap:12px">
          <label class="f">Your firm (marks colleagues as internal)<input type="text" id="s-firm" value="${esc(S.settings.firm || "")}" placeholder="e.g. Greystar"></label>
          <div class="grid2">
            <label class="f">Conversations per week<input type="number" id="s-target" min="1" max="15" value="${esc(S.settings.weeklyTarget || 3)}"></label>
            <label class="f">Promotion target date<input type="date" id="s-date" value="${esc(S.settings.targetDate || "")}"></label>
          </div>
          <p class="hint" style="margin:0">Cadence: inner circle every 30 days, core every 90, wide every 180.</p>
        </div>
        <div class="sec-head" style="margin-top:24px"><h2 class="sec-title">Add someone by hand</h2></div>
        <button class="btn" data-action="new-contact">${ICON.plus} Add a person</button>
      </section>
    </div>`;
  }

  // ---------- Drawer ----------
  function openDrawer(id) { S.open = id; renderDrawer(); $("#drawer").classList.add("open"); $("#scrim").classList.add("open"); setTimeout(() => $("#drawer .dclose")?.focus(), 50); }
  function closeDrawer() { S.open = null; $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); render(); }
  function renderDrawer() {
    const c = S.contacts.get(S.open); const d = $("#drawer");
    if (!c) { d.innerHTML = ""; return; }
    const touches = [...(c.touches || [])].map((t, i) => ({ ...t, i })).sort((a, b) => b.d.localeCompare(a.d));
    const i = dueInfo(c);
    d.innerHTML = `<div class="dhead"><div style="min-width:0">
        <h2>${esc(fullName(c))}</h2>
        <div class="sub">${esc([c.position, c.company].filter(Boolean).join(" · ") || "No title on file")}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${tierPill(c)}${i ? `<span class="pill ${i.cls}">${esc(i.label)}</span>` : ""}${c.connectedOn ? `<span class="pill">Connected ${esc(c.connectedOn)}</span>` : ""}</div>
      </div><button class="btn ghost dclose" data-action="close" aria-label="Close">${ICON.x}</button></div>
      <div class="stack">
        ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener" class="btn sm" style="align-self:flex-start;text-decoration:none">${ICON.ext} LinkedIn profile</a>` : ""}
        ${c.source === "manual" ? `<div class="grid2">
          <label class="f">First name<input type="text" data-c="first" value="${esc(c.first || "")}"></label>
          <label class="f">Last name<input type="text" data-c="last" value="${esc(c.last || "")}"></label>
          <label class="f">Company<input type="text" data-c="company" value="${esc(c.company || "")}"></label>
          <label class="f">Title<input type="text" data-c="position" value="${esc(c.position || "")}"></label></div>` : ""}
        <div class="grid2">
          <label class="f">Tier<select data-c="tier">${opts(TIERS, c.tier || "none")}</select></label>
          <label class="f">Function<select data-c="fn">${opts(FNS, c.fn)}</select></label>
          <label class="f">Internal or external<select data-c="side">${opts([["external", "External"], ["internal", "Internal"]], c.side || "external")}</select></label>
          <label class="f">Role in your promotion<select data-c="role">${opts(ROLES, c.role || "")}</select></label>
        </div>
        <label class="f">Linked win<select data-c="winId">${opts([["", "None"], ...S.wins.map((w) => [w.id, w.title])], c.winId || "")}</select></label>
        <label class="f">What they care about<textarea data-c="cares" placeholder="Their deals, their problems, what they're trying to get done">${esc(c.cares || "")}</textarea></label>
        <label class="f">I owe them<input type="text" data-c="owe" value="${esc(c.owe || "")}" placeholder="e.g. Send lease comps for the Frisco asset"></label>
        <label class="f">Notes<textarea data-c="notes">${esc(c.notes || "")}</textarea></label>
        <div>
          <div class="sec-title" style="margin-bottom:8px">Log a touch</div>
          <div class="addtouch">
            <input type="date" id="t-date" value="${today()}" aria-label="Date">
            <select id="t-type" aria-label="Type">${opts(TOUCH_TYPES, "lunch")}</select>
            <input type="text" id="t-note" placeholder="What did you learn?" aria-label="Note">
            <button class="btn primary" data-action="add-touch">Log</button>
          </div>
        </div>
        <div class="touches">${touches.length ? touches.map((t) => `<div class="touch"><div class="when">${esc(fmtDate(t.d))} · ${esc(TOUCH[t.t] || t.t)} <button class="btn ghost sm" data-deltouch="${t.i}" aria-label="Remove this entry" style="padding:0 4px">${ICON.x}</button></div>${t.n ? `<div class="what">${esc(t.n)}</div>` : ""}</div>`).join("") : `<div class="touch"><div class="when">No touches logged yet.</div></div>`}</div>
        <div style="display:flex;justify-content:flex-end;gap:8px;align-items:center" id="del-wrap"><button class="btn ghost sm danger" data-action="ask-delete">Delete contact</button></div>
      </div>`;
  }

  // ---------- Actions ----------
  function setTab(t) { S.tab = t; S.limit = 120; try { localStorage.setItem("networker.tab", t); } catch (e) {} render(); window.scrollTo({ top: 0 }); }

  function newContact() {
    const id = "m-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const c = { key: id, first: "", last: "", company: "", position: "", url: "", email: "", connectedOn: "", fn: "other", fnAuto: false, side: "external", tier: "core", role: "", cares: "", owe: "", notes: "", winId: "", touches: [], lastTouch: "", source: "manual", createdAt: today() };
    S.contacts.set(id, { ...c, id });
    setDoc("contacts/" + id, c);
    openDrawer(id);
    setTimeout(() => $('#drawer [data-c="first"]')?.focus(), 80);
  }

  function addTouch() {
    const c = S.contacts.get(S.open); if (!c) return;
    const d = $("#t-date").value || today(), t = $("#t-type").value, n = $("#t-note").value.trim();
    const touches = [...(c.touches || []), { d, t, n }];
    const lastTouch = touches.reduce((m, x) => (x.d > m ? x.d : m), "");
    saveContact(c.id, { touches, lastTouch });
    renderDrawer(); toast(`Logged ${TOUCH[t].toLowerCase()} with ${c.first || fullName(c)}`);
  }
  function delTouch(idx) {
    const c = S.contacts.get(S.open); if (!c) return;
    const touches = (c.touches || []).filter((_, i) => i !== idx);
    const lastTouch = touches.reduce((m, x) => (x.d > m ? x.d : m), "");
    saveContact(c.id, { touches, lastTouch }); renderDrawer();
  }

  // ---------- CSV import ----------
  function parseCSV(text) {
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { row.push(f); f = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += ch;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows;
  }
  async function importFile(file) {
    if (!db) { toast("Open this page in claude.ai while signed in to import."); return; }
    if (S.dbState === "readonly") { toast("This view can't save changes."); return; }
    const text = (await file.text()).replace(/^﻿/, "");
    const rows = parseCSV(text);
    const h = rows.findIndex((r) => r.map((x) => x.trim().toLowerCase()).includes("first name"));
    if (h < 0) { toast("That file doesn't look like LinkedIn's Connections.csv."); return; }
    const head = rows[h].map((x) => x.trim().toLowerCase());
    const col = (name) => head.indexOf(name);
    const ix = { first: col("first name"), last: col("last name"), url: col("url"), email: col("email address"), company: col("company"), position: col("position"), on: col("connected on") };
    const recs = rows.slice(h + 1).filter((r) => r.length > 1 && (r[ix.first] || r[ix.last]));
    const ops = []; let added = 0, updated = 0;
    for (const r of recs) {
      const g = (k) => (ix[k] >= 0 ? (r[ix[k]] || "").trim() : "");
      const url = g("url");
      const slug = url ? (url.split("/in/")[1] || url).replace(/\/+$/, "") : `${g("first")}-${g("last")}-${g("company")}`;
      const id = "li-" + safeId(decodeURIComponentSafe(slug)).toLowerCase();
      if (id === "li-") continue;
      const company = g("company"), position = g("position");
      const ex = S.contacts.get(id);
      if (ex) {
        const patch = {};
        if (company !== (ex.company || "")) patch.company = company;
        if (position !== (ex.position || "")) patch.position = position;
        if (g("email") && g("email") !== ex.email) patch.email = g("email");
        if (ex.fnAuto && (patch.company !== undefined || patch.position !== undefined)) patch.fn = classify(position, company);
        if (Object.keys(patch).length) { updated++; ops.push(() => { Object.assign(ex, patch); return db.doc("contacts/" + id).update(patch); }); }
      } else {
        const c = { key: id, first: g("first"), last: g("last"), company, position, url, email: g("email"), connectedOn: g("on"), fn: classify(position, company), fnAuto: true, side: isInternal(company) ? "internal" : "external", tier: "none", role: "", cares: "", owe: "", notes: "", winId: "", touches: [], lastTouch: "", source: "linkedin", createdAt: today() };
        added++;
        S.contacts.set(id, { ...c, id });
        ops.push(() => db.doc("contacts/" + id).set(c));
      }
    }
    if (!ops.length) { toast("Everyone in that file is already here."); return; }
    S.importing = { total: ops.length, done: 0, label: `Saving 0 of ${ops.length}…` }; render();
    let failed = 0, next = 0;
    const worker = async () => {
      while (next < ops.length) {
        const op = ops[next++];
        try { await withRetry(op); } catch (e) { failed++; if (e && (e.code === "quota_exceeded" || e.code === "invalid_argument")) { next = ops.length; onWriteError(e); } }
        S.importing.done++;
        if (S.importing.done % 10 === 0 || S.importing.done === ops.length) { S.importing.label = `Saving ${S.importing.done} of ${ops.length}…`; if (S.tab === "import") render(); }
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    S.importing = null;
    toast(`${added} added, ${updated} updated${failed ? `, ${failed} failed` : ""}.`);
    await refresh();
    if (added) setTab("triage");
  }
  function decodeURIComponentSafe(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

  function newWin() {
    const id = "w-" + Date.now().toString(36);
    const order = (S.wins.reduce((m, w) => Math.max(m, w.order || 0), 0) || 0) + 1;
    const w = { title: "", area: "other", status: "idea", target: "", impact: "", order };
    S.wins = [...S.wins, { ...w, id }]; render();
    setDoc("wins/" + id, w);
    setTimeout(() => document.getElementById("wt-" + id)?.focus(), 30);
  }

  function saveSettings(patch) {
    S.settings = { ...S.settings, ...patch };
    if (db) setDoc("settings/main", { firm: S.settings.firm || "", weeklyTarget: Number(S.settings.weeklyTarget) || 3, targetDate: S.settings.targetDate || "2027-12-15" });
  }

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-tab],[data-open],[data-action],[data-tier],[data-tfn],[data-cov],[data-delwin],[data-deltouch]");
    if (!el) { if (e.target.id === "scrim") closeDrawer(); return; }
    if (el.dataset.tier && el.dataset.cid) {
      const c = S.contacts.get(el.dataset.cid);
      saveContact(el.dataset.cid, { tier: el.dataset.tier });
      toast(el.dataset.tier === "skip" ? `${fullName(c)} hidden for now` : `${fullName(c)} → ${TIER[el.dataset.tier]}`);
      render(); return;
    }
    if (el.dataset.tab) { if (S.open) closeDrawer(); setTab(el.dataset.tab); return; }
    if (el.dataset.open) { openDrawer(el.dataset.open); return; }
    if (el.dataset.tfn !== undefined) { S.triageFn = el.dataset.tfn; S.limit = 120; render(); return; }
    if (el.dataset.cov) { S.filters = { q: "", side: "external", fn: el.dataset.cov, tier: "" }; setTab("people"); return; }
    if (el.dataset.delwin) {
      const id = el.dataset.delwin;
      if (el.dataset.confirm) { S.wins = S.wins.filter((w) => w.id !== id); deleteDoc("wins/" + id); for (const c of S.contacts.values()) if (c.winId === id) saveContact(c.id, { winId: "" }); render(); }
      else { el.dataset.confirm = "1"; el.textContent = "Click again to remove"; }
      return;
    }
    if (el.dataset.deltouch !== undefined) { delTouch(Number(el.dataset.deltouch)); return; }
    const a = el.dataset.action;
    if (a === "close") closeDrawer();
    else if (a === "new-contact") newContact();
    else if (a === "new-win") newWin();
    else if (a === "more") { S.limit += 200; render(); }
    else if (a === "add-touch") addTouch();
    else if (a === "ask-delete") {
      $("#del-wrap").innerHTML = `<span class="hint">Delete ${esc(fullName(S.contacts.get(S.open)))} and their history?</span><button class="btn sm" data-action="cancel-delete">Keep</button><button class="btn sm danger" data-action="confirm-delete">Delete</button>`;
    } else if (a === "cancel-delete") renderDrawer();
    else if (a === "confirm-delete") { const id = S.open; S.contacts.delete(id); deleteDoc("contacts/" + id); closeDrawer(); toast("Contact deleted"); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && S.open) closeDrawer();
    if (e.key === "Enter" && e.target.classList?.contains("row") && e.target.dataset.open) openDrawer(e.target.dataset.open);
    if (e.key === "Enter" && e.target.id === "t-note") addTouch();
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "f-q") { S.filters.q = t.value; S.limit = 120; debounced("search", render, 150); return; }
    if (t.dataset.c && S.open && (t.tagName === "TEXTAREA" || t.type === "text")) {
      const id = S.open, field = t.dataset.c, val = t.value;
      S.contacts.get(id)[field] = val;
      debounced(id + field, () => saveContact(id, { [field]: val }));
      return;
    }
    if (t.dataset.win && (t.type === "text" || t.tagName === "TEXTAREA")) { const id = t.dataset.win, f = t.dataset.field, v = t.value; const w = S.wins.find((x) => x.id === id); if (w) w[f] = v; debounced("w" + id + f, () => updateDoc("wins/" + id, { [f]: v })); return; }
    if (t.id === "s-firm") debounced("firm", () => saveSettings({ firm: t.value.trim() }), 700);
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "f-tier" || t.id === "f-side" || t.id === "f-fn") { S.filters[t.id.slice(2)] = t.value; S.limit = 120; render(); return; }
    if (t.dataset.c && S.open && t.tagName === "SELECT") {
      const patch = { [t.dataset.c]: t.value }; if (t.dataset.c === "fn") patch.fnAuto = false;
      saveContact(S.open, patch); renderDrawer(); return;
    }
    if (t.dataset.tfnset) { saveContact(t.dataset.tfnset, { fn: t.value, fnAuto: false }); return; }
    if (t.dataset.ms) { const m = S.milestones.find((x) => x.id === t.dataset.ms); if (m) { m.done = t.checked; updateDoc("milestones/" + m.id, { done: t.checked }); if (t.checked) toast("Milestone done"); render(); } return; }
    if (t.dataset.win && (t.tagName === "SELECT" || t.type === "month")) { const id = t.dataset.win, f = t.dataset.field; const w = S.wins.find((x) => x.id === id); if (w) w[f] = t.value; updateDoc("wins/" + id, { [f]: t.value }); render(); return; }
    if (t.id === "file" && t.files[0]) { importFile(t.files[0]); t.value = ""; return; }
    if (t.id === "s-target") { saveSettings({ weeklyTarget: Math.max(1, Math.min(15, Number(t.value) || 3)) }); return; }
    if (t.id === "s-date" && t.value) { saveSettings({ targetDate: t.value }); render(); return; }
    if (t.id === "s-firm") { saveSettings({ firm: t.value.trim() }); return; }
  });
  ["dragover", "dragenter"].forEach((ev) => document.addEventListener(ev, (e) => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } }));
  document.addEventListener("dragleave", (e) => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("over"); });
  document.addEventListener("drop", (e) => { const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("over"); const f = e.dataTransfer?.files?.[0]; if (f) importFile(f); });
  $("#scrim").addEventListener("click", closeDrawer);

  boot();
})();
</script>
